<style>
/* Layout: barra superior con navegación, contenido en columna de lectura (~68ch); herramientas en rejilla; barra inferior en teléfono. Identidad tomada de la presentación (pizarra + azul institucional + rojo Distrileco). */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EDF1F5; --ink:#1F2933; --ink-2:#3E4C59; --muted:#66727F; --line:#D8DEE6;
  --accent:#3B6EA8; --accent-ink:#FFFFFF; --accent-soft:#E3ECF6;
  --red:#C2362F; --red-soft:#FBEAE8; --gold:#B7791F; --gold-soft:#FBF1DF; --green:#2F7D5B; --green-soft:#E3F2EA;
  --hero:#1F2933; --hero-ink:#F4F6F9; --hero-muted:#AAB6C2;
  --f-display:"Libre Baskerville", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(31,41,51,.06),0 4px 14px rgba(31,41,51,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181F; --surface:#1A222B; --surface-2:#222C37; --ink:#E6EBF0; --ink-2:#C3CCD5; --muted:#8C99A6; --line:#2E3A46;
  --accent:#7BA7DA; --accent-ink:#0F1820; --accent-soft:#1F3248;
  --red:#F08A80; --red-soft:#3A2220; --gold:#E3B25E; --gold-soft:#372B18; --green:#6CC59B; --green-soft:#183027;
  --hero:#0C1117; --hero-ink:#E6EBF0; --hero-muted:#8C99A6; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181F; --surface:#1A222B; --surface-2:#222C37; --ink:#E6EBF0; --ink-2:#C3CCD5; --muted:#8C99A6; --line:#2E3A46;
  --accent:#7BA7DA; --accent-ink:#0F1820; --accent-soft:#1F3248;
  --red:#F08A80; --red-soft:#3A2220; --gold:#E3B25E; --gold-soft:#372B18; --green:#6CC59B; --green-soft:#183027;
  --hero:#0C1117; --hero-ink:#E6EBF0; --hero-muted:#8C99A6; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hero)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.read{max-width:760px}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hero);color:var(--hero-ink);border-bottom:1px solid rgba(255,255,255,.06)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand img{width:38px;height:38px;border-radius:50%;background:#fff;padding:2px}
.brand b{display:block;font-size:14px;letter-spacing:.02em}
.brand small{display:block;font-size:11.5px;color:var(--hero-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{color:var(--hero-muted);text-decoration:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:8px;display:flex;align-items:center;gap:7px}
.nav a:hover{color:var(--hero-ink);background:rgba(255,255,255,.06)}
.nav a.on{color:var(--hero-ink);background:rgba(255,255,255,.1)}
.btn-present{display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.tabbar{display:none}
@media (max-width:860px){
  .nav{display:none}
  .btn-present span{display:none}
  .btn-present{margin-left:auto}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 0;border-radius:8px}
  .tabbar a.on{color:var(--accent)}
  main{padding-bottom:84px}
}

/* Hero */
.hero{background:var(--hero);color:var(--hero-ink)}
.hero .wrap{padding-block:44px 52px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:40px;align-items:center}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero .eyebrow{color:#9DBFE6}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4.4vw,44px);margin:12px 0 16px}
.hero h1 em{font-style:italic;color:#9DBFE6}
.hero p{color:var(--hero-muted);max-width:56ch;margin:0}
.hero .who{display:flex;align-items:center;gap:12px;margin-top:22px;font-size:14px;color:var(--hero-muted)}
.hero .who img{width:52px;background:#fff;border-radius:6px;padding:4px}
.hero .who b{color:var(--hero-ink);display:block}
.prog{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:22px;display:grid;gap:14px}
.prog .ring{display:flex;align-items:center;gap:16px}
.prog svg{width:84px;height:84px;flex:none}
.prog .big{font-family:var(--f-display);font-size:30px;line-height:1}
.prog small{color:var(--hero-muted);font-size:13px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.b{display:inline-flex;align-items:center;gap:8px;border-radius:9px;padding:10px 16px;font-weight:700;font-size:14.5px;text-decoration:none;border:1px solid transparent;cursor:pointer;background:var(--surface-2);color:var(--ink)}
.b.pri{background:var(--accent);color:var(--accent-ink)}
.b.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.hero .b.ghost{border-color:rgba(255,255,255,.25);color:var(--hero-ink)}
.b.danger{background:var(--red-soft);color:var(--red)}
.b.sm{padding:7px 11px;font-size:13px}
.b:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:760px){.hero .wrap{grid-template-columns:1fr;gap:24px;padding-block:30px 34px}}

/* Secciones */
.sec{padding-block:36px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3vw,28px)}
.sec-h p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.mods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.mods{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.mods{grid-template-columns:1fr}}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-decoration:none;color:inherit;display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;transition:border-color .15s, transform .15s}
.mod:hover{border-color:var(--accent);transform:translateY(-1px)}
.mod .mh{display:flex;align-items:center;justify-content:space-between}
.mod .mi{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.mod .num{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.mod h3{font-size:17px}
.mod p{margin:0;color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.mod .mf{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.mod .mf .bar{flex:1}

.commits{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;counter-reset:c}
@media (max-width:900px){.commits{grid-template-columns:1fr}}
.commit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;font-weight:600;font-size:14.5px;line-height:1.4}
@media (max-width:900px){.commit{flex-direction:row;align-items:center}}
.commit .ci{width:36px;height:36px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;flex:none}

/* Lección */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.lesson-h h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3.4vw,34px);margin:8px 0 6px}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chip{font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);border-radius:99px;padding:3px 10px;white-space:nowrap}
.blocks{display:grid;gap:18px;margin-top:22px}
.blocks p{margin:0}
.lead{font-size:18px;line-height:1.55;color:var(--ink-2);border-left:3px solid var(--accent);padding-left:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px;align-content:start;min-width:0}
.card .ch{display:flex;align-items:center;gap:10px;font-weight:700}
.card .ci{color:var(--accent)}
.card .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;justify-self:start}
.card p{color:var(--ink-2);font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat .n{font-family:var(--f-display);font-size:38px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.stat .n small{font-family:var(--f-body);font-size:14px;font-weight:700;color:var(--ink-2);margin-left:4px}
.stat b{display:block;margin-top:8px;font-size:14.5px}
.stat p{font-size:13.5px;color:var(--muted);margin-top:2px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
tr.cur td{background:var(--accent-soft);font-weight:700}
.steps{display:grid;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;position:relative;padding-bottom:18px}
.step:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.step .sn{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;counter-increment:s}
.step .sn::before{content:counter(s)}
.step b{display:block;padding-top:8px}
.step p{color:var(--ink-2);font-size:14.5px}
.lst{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.lst h4{margin:0 0 8px;font-size:15px;display:flex;gap:8px;align-items:center}
.lst ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.lst li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:14.5px;color:var(--ink-2)}
.lst li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:9px;justify-self:center}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.callout{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;border-radius:var(--r);padding:14px 16px;font-size:14.5px}
.callout.info{background:var(--accent-soft);color:var(--ink)}
.callout.info .ico{color:var(--accent)}
.callout.warn{background:var(--red-soft)}
.callout.warn .ico{color:var(--red)}
.callout.ok{background:var(--green-soft)}
.callout.ok .ico{color:var(--green)}
.callout.gold{background:var(--gold-soft)}
.callout.gold .ico{color:var(--gold)}
.org{display:grid;gap:6px}
.org div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14.5px;display:flex;gap:10px;align-items:center}
.org div span{font-size:12px;font-weight:800;color:var(--accent);width:18px}
.more{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.more summary{cursor:pointer;padding:12px 16px;font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:center;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more[open] summary{border-bottom:1px solid var(--line)}
.more div{padding:12px 16px;color:var(--ink-2);font-size:14.5px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager a{display:grid;gap:2px;text-decoration:none;color:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-width:48%;min-width:0}
.pager a small{color:var(--muted);font-size:12px}
.pager a b{font-size:14px;line-height:1.35}
.pager a.nx{text-align:right;margin-left:auto}
@media (max-width:560px){.pager a{max-width:100%;width:100%}}
.done-row{display:flex;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.done-pill{display:inline-flex;align-items:center;gap:6px;color:var(--green);background:var(--green-soft);font-weight:700;font-size:13px;padding:5px 10px;border-radius:99px}

/* Lista de temas */
.toc{display:grid;gap:22px}
.toc-m{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.toc-m header{display:flex;gap:14px;align-items:center;padding:16px 18px;background:var(--surface-2)}
.toc-m header .mi{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.toc-m header h3{font-size:17px}
.toc-m header p{margin:0;font-size:13px;color:var(--muted)}
.toc-m ol{list-style:none;margin:0;padding:0}
.toc-m li a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);text-decoration:none;color:inherit;font-size:15px}
.toc-m li a:hover{background:var(--surface-2)}
.toc-m li .k{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.tick.on{background:var(--green);border-color:var(--green);color:#fff}
.tick .ico{width:13px;height:13px;stroke-width:3}

/* Buscar */
.search{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 14px}
.search input{border:0;background:transparent;flex:1;padding:10px 0;outline:none;min-width:0;font-size:16px}
.results{display:grid;gap:10px;margin-top:14px}
.res{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;text-decoration:none;color:inherit}
.res small{color:var(--muted);font-size:12px;font-weight:600}
.res b{display:block}
.res p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 2px}

/* Herramientas */
.tools-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tools-nav button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tools-nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tool{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
@media (max-width:820px){.tool{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;min-width:0}
.panel h3{font-size:18px}
.panel > p{margin:0;color:var(--muted);font-size:14px}
.f{display:grid;gap:5px}
.f label{font-size:13px;font-weight:700;color:var(--ink-2)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;font-size:16px;font-variant-numeric:tabular-nums}
.f .hint{font-size:12.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.out{display:grid;gap:0}
.out .ln{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.out .ln span:last-child{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.out .ln.tot{border-bottom:0;padding-top:12px;font-size:17px}
.out .ln.tot span:last-child{color:var(--accent);font-family:var(--f-display)}
.fine{font-size:12.5px;color:var(--muted);margin:0}
.dl{display:grid;gap:8px}
.dl .d{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-radius:9px;background:var(--surface-2)}
.dl .d b{display:block;font-size:14.5px}
.dl .d small{color:var(--muted);font-size:12.5px}
.dl .d .dt{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.status{font-weight:700;border-radius:8px;padding:10px 12px;font-size:14px}
.status.ok{background:var(--green-soft);color:var(--green)}
.status.bad{background:var(--red-soft);color:var(--red)}

/* Evaluación */
.quiz{max-width:720px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--muted);font-weight:600}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.qcard h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin-bottom:16px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:15px;display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .lt{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}
.expl{margin-top:14px}
.score{text-align:center;display:grid;gap:10px;justify-items:center}
.score .big{font-family:var(--f-display);font-size:56px;line-height:1;color:var(--accent)}

/* Constancia */
.sig{border:1.5px dashed var(--line);border-radius:10px;background:var(--bg);touch-action:none;width:100%;height:170px;display:block;cursor:crosshair}
.const-txt{font-family:var(--f-display);font-size:15px;line-height:1.75;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:16px}
.plan{display:grid;gap:8px}
.pl{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.pl b{display:block;font-size:14.5px}
.pl small{color:var(--muted);font-size:12.5px;display:block}
.pl img{width:120px;height:48px;object-fit:contain;background:#fff;border-radius:6px;border:1px solid var(--line)}
@media (max-width:520px){.pl{grid-template-columns:minmax(0,1fr) auto}.pl img{grid-column:1/-1;width:100%;height:60px}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:90;box-shadow:var(--shadow)}
@media (min-width:861px){.toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}

/* Contacto */
.contact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.contact{grid-template-columns:1fr}}
.contact .card .v{font-weight:700;word-break:break-word;user-select:all}

footer{border-top:1px solid var(--line);margin-top:30px}
footer .wrap{padding-block:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* Modo presentación */
.pres{position:fixed;inset:0;z-index:100;background:var(--hero);color:var(--hero-ink);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.pres-top,.pres-bot{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;color:var(--hero-muted)}
.pres-top b{color:var(--hero-ink)}
.pres-top .sp,.pres-bot .sp{flex:1}
.pb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--hero-ink);border-radius:8px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.pb.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.stage-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0}
.stage{overflow:auto;display:flex;justify-content:center;padding:8px 16px 16px}
.slide{--bg:#F7F9FB;--surface:#FFFFFF;--surface-2:#EDF1F5;--ink:#1F2933;--ink-2:#3E4C59;--muted:#66727F;--line:#D8DEE6;--accent:#3B6EA8;--accent-ink:#fff;--accent-soft:#E3ECF6;--red:#C2362F;--red-soft:#FBEAE8;--gold:#B7791F;--gold-soft:#FBF1DF;--green:#2F7D5B;--green-soft:#E3F2EA;
  color-scheme:light;background:var(--bg);color:var(--ink);width:min(100%,1180px);border-radius:12px;padding:clamp(20px,3.4vw,44px);align-self:flex-start;box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative}
.slide .eyebrow{font-size:12.5px}
.slide h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,2.8vw,34px);margin:8px 0 4px}
.slide .blocks{margin-top:16px;gap:14px}
.slide .sfoot{display:flex;justify-content:space-between;margin-top:20px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.slide.dark{background:#1F2933;color:#F4F6F9;min-height:min(70vh,640px);display:flex;flex-direction:column;justify-content:center}
.slide.dark h2{font-size:clamp(30px,5vw,58px);color:#fff}
.slide.dark p{color:#AAB6C2;max-width:60ch}
.slide.dark .eyebrow{color:#9DBFE6}
.slide .cover-logos{display:flex;gap:18px;align-items:center;margin-bottom:24px}
.slide .cover-logos img{height:64px;background:#fff;border-radius:8px;padding:5px}
.notes{width:min(380px,40vw);background:#111820;border-left:1px solid rgba(255,255,255,.08);overflow:auto;padding:16px 18px;font-size:14.5px;line-height:1.6;color:#C9D3DD}
.notes h4{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9DBFE6}
@media (max-width:760px){.stage-wrap{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.notes{width:auto;max-height:34vh;border-left:0;border-top:1px solid rgba(255,255,255,.08)}}
.pdots{height:3px;background:rgba(255,255,255,.08)}
.pdots i{display:block;height:100%;background:var(--accent);transition:width .2s}

@media print{
  .top,.tabbar,footer,.no-print,.toast{display:none!important}
  body{background:#fff;color:#000}
  .sec{padding:0}
  .print-only{display:block!important}
}
.print-only{display:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

   {i:"clock", h:"Término fijo", x:"Siempre por escrito y hasta por 4 años. Si es inferior a un año, tras la cuarta prórroga se renueva por un año. Sin preaviso de 30 días, se prorroga automáticamente."},

   {n:"31 ene", h:"Intereses a las cesantías", x:"Fecha límite para pagar directamente al trabajador los intereses: 12% anual sobre el saldo a 31 de diciembre (Ley 52 de 1975)."},

   {i:"book", h:"Soportes según el caso", x:"Promesa de compraventa · presupuesto o cotizaciones de obra · extracto del crédito hipotecario · recibo del impuesto · copia de la cédula."}

   "Paso a salario integral: certificación del empleador",

  {t:"steps", h:"Cómo se tramita cualquier retiro", items:[

   {h:"Solicitud al fondo", x:"El trabajador presenta la solicitud al fondo, de forma presencial o virtual (Decreto 1562 de 2019)."},

  ]},
  {t:"callout", k:"info", i:"checkc", x:"En el retiro por terminación del contrato no se requiere autorización del empleador: basta la prueba de la terminación. En los retiros parciales la empresa debe vigilar la correcta destinación, por eso exige los soportes antes de autorizar."}
 ],
 n:"Cierre del tema de cesantías. La empresa está obligada a verificar y vigilar la correcta destinación de los retiros parciales; por ello exige los soportes antes de autorizar. En el retiro por terminación del contrato no se requiere autorización del empleador, basta la prueba de la terminación."},

/* ---------- 04 DISCIPLINARIO ---------- */
{id:"principios", m:"disciplinario", t:"Principios y límites de la potestad disciplinaria", s:21,
 refs:["Arts. 90 a 92 RIT","Arts. 111 a 115 CST"],
 b:[
  {t:"cards", items:[
   {i:"book", h:"Legalidad y tipicidad", x:"Solo se imponen las sanciones previstas en el Reglamento, el contrato, pactos o convenciones (art. 114 CST)."},
   {i:"shield", h:"Dignidad", x:"Prohibidas las penas corporales y toda medida lesiva de la dignidad del trabajador (art. 111 CST)."},
   {i:"clock", h:"Límite de la suspensión", x:"Máximo 8 días la primera vez y 2 meses en caso de reincidencia (art. 112 CST)."},
   {i:"chart", h:"Progresividad y reincidencia", x:"Las sanciones del cuadro de 101 faltas se gradúan según gravedad, circunstancias, perjuicio y antecedentes; la reincidencia se computa en los 12 meses anteriores (art. 92)."},
   {i:"key", h:"Competencia", x:"La comprobación de faltas y la aplicación de sanciones está reservada al Gerente General (art. 91). Los jefes de área reportan y documentan; no sancionan por sí mismos."},
   {i:"checkc", h:"Debido proceso", x:"Ninguna sanción se impone sin agotar íntegramente el procedimiento del artículo 108; la impuesta en su contravención carece de validez (art. 92, parágrafo 2; art. 115 CST)."},
   {i:"db", h:"Multas", x:"Solo por retardos o faltas al trabajo; no exceden la quinta parte del salario de un día y se destinan a premios para los trabajadores (art. 113 CST)."}
  ]}
 ],
 n:"Artículos 90 a 92 del RIT. El cuadro de faltas y sanciones (101 conductas) hace parte del Reglamento entregado a cada trabajador; aquí basta explicar su lógica progresiva. Aclarar la aparente tensión entre el artículo 83 (faculta al Representante Legal, Administrador y Jefes de Área) y el artículo 91 (reserva al Gerente General): la decisión sancionatoria la adopta el Gerente General; los demás niveles instruyen, reportan y documentan."},

{id:"faltas-graves", m:"disciplinario", t:"Faltas graves: conductas que habilitan la terminación con justa causa", s:22,
 refs:["Arts. 92 y 93 RIT","Art. 62 num. 6 CST","Resolución 2674 de 2013"],
 b:[
  {t:"cols", items:[
   {i:"warn", h:"Seguridad y conducta", list:[
    "Presentarse bajo efectos de alcohol o sustancias psicoactivas (40)",
    "Conducir vehículos de la empresa sin licencia vigente o bajo efectos de alcohol (71 y 72)",
    "Transportar alimentos junto con sustancias tóxicas (68)",
    "Revelar información reservada o entregar la base de clientes a terceros (97 y 99)"]},
   {i:"db", h:"Mercancía e inventarios", list:[
    "Retirar mercancía, insumos o envases sin autorización escrita (52)",
    "Consumir, obsequiar o apropiarse de productos, cualquiera que sea su valor (53)",
    "Alterar fechas de vencimiento, lotes o precios (60)",
    "Manipular los registros del sistema de inventarios (61)"]},
   {i:"chart", h:"Recaudo y facturación", list:[
    "No consignar la totalidad de los dineros recaudados (85)",
    "Retener dineros o destinarlos a fines propios, aunque luego se restituyan (86)",
    "Expedir recibos o facturas adulterados (89)",
    "Recibir dádivas o comisiones de proveedores o clientes (63)"]}
  ]},
  {t:"callout", k:"warn", i:"book", x:"La calificación de una conducta como falta grave habilita la terminación del contrato con justa causa (art. 62, numeral 6, literal a, CST), previa observancia del debido proceso. A estas se suman las causales del artículo 93 del RIT. Los números entre paréntesis corresponden al cuadro de faltas del artículo 92."},
  {t:"callout", k:"gold", i:"activity", x:"Distrileco es una distribuidora de alimentos: las faltas sobre manipulación, cadena de frío y producto vencido también comprometen la responsabilidad sanitaria (Resolución 2674 de 2013)."}
 ],
 n:"Artículos 92 (parágrafos 3 y 4) y 93 del RIT. Las faltas sobre mercancía, recaudo, facturación y vehículos se predican de todo trabajador que tenga bienes o dineros a su disposición. Enfatizar que la empresa es una distribuidora de alimentos: las faltas sobre manipulación, cadena de frío y producto vencido también comprometen la responsabilidad sanitaria frente a la Resolución 2674 de 2013."},

{id:"procedimiento", m:"disciplinario", t:"El procedimiento disciplinario en cuatro etapas (art. 108)", s:23,
 refs:["Art. 108 RIT","Art. 115 CST","Art. 7 Ley 2466 de 2025","Sentencia C-593 de 2014"],
 b:[
  {t:"steps", items:[
   {h:"Apertura y formulación de cargos", x:"Comunicación escrita con hechos, conductas, normas vulneradas y copia de las pruebas."},
   {h:"Descargos y defensa", x:"Mínimo 5 días hábiles para controvertir pruebas y aportar las propias, por escrito o en diligencia verbal."},
   {h:"Decisión motivada", x:"Pronunciamiento escrito que analiza hechos, pruebas y argumentos; sanción proporcional, notificada formalmente."},
   {h:"Recurso de reposición", x:"5 días hábiles para interponerlo; se resuelve en máximo 15 días hábiles y suspende los efectos de la sanción."}
  ]},
  {t:"callout", k:"warn", i:"warn", x:"Todas las actuaciones quedan documentadas en el expediente laboral. La sanción impuesta sin agotar estas etapas carece de validez (art. 108, parágrafo 1; art. 115 CST, modificado por el art. 7 de la Ley 2466 de 2025)."},
  {t:"tool", h:"Calcula los plazos de descargos y reposición", to:"plazos"}
 ],
 n:"Diapositiva central. Presentar el flujo completo antes de detallar cada etapa. Recordar que este procedimiento recoge los elementos mínimos fijados por la Corte Constitucional en la Sentencia C-593 de 2014 y que la Ley 2466 de 2025 los elevó a rango legal en el artículo 115 del CST."},

/* ---------- 05 SST ---------- */
{id:"at-el", m:"sst", t:"¿Qué es un accidente de trabajo y qué es una enfermedad laboral?", s:25,
 refs:["Arts. 3 y 4 Ley 1562 de 2012"],
 b:[
  {t:"cols", items:[
   {i:"bolt", h:"Accidente de trabajo (art. 3, Ley 1562 de 2012)", x:"Todo suceso repentino que sobrevenga por causa o con ocasión del trabajo y que produzca una lesión orgánica, una perturbación funcional o psiquiátrica, una invalidez o la muerte.", list:[
    "Incluye el ocurrido ejecutando órdenes del empleador, aun fuera del lugar y horas de trabajo",
    "Durante el traslado en transporte suministrado por el empleador",
    "En actividades recreativas o deportivas por cuenta o en representación de la empresa"]},
   {i:"activity", h:"Enfermedad laboral (art. 4, Ley 1562 de 2012)", x:"La contraída como resultado de la exposición a factores de riesgo inherentes a la actividad laboral o al medio en que el trabajador se ha visto obligado a trabajar.", list:[
    "El Gobierno fija la tabla de enfermedades laborales; las no incluidas pueden reconocerse si se prueba la relación de causalidad",
    "Su calificación en primera oportunidad corresponde a la EPS o la ARL y, en controversia, a las Juntas de Calificación de Invalidez",
    "Ejemplos típicos en distribución: lesiones osteomusculares por manipulación de cargas y posturas repetitivas"]}
  ]},
  {t:"callout", k:"info", i:"bolt", x:"El accidente es súbito; la enfermedad es progresiva. El accidente en el trayecto casa-trabajo solo se cubre si el transporte lo suministra la empresa. En ambos casos las prestaciones asistenciales y económicas las asume la ARL."}
 ],
 n:"Diferenciar: el accidente es súbito; la enfermedad es progresiva. El accidente de trabajo en el trayecto casa-trabajo solo se cubre si el transporte lo suministra la empresa. En ambos casos las prestaciones asistenciales y económicas las asume la ARL."},

{id:"accidente", m:"sst", t:"Procedimiento ante un accidente de trabajo", s:26,
 refs:["Arts. 78 a 81 RIT","Art. 62 Decreto 1295 de 1994","Resolución 1401 de 2007","Art. 2.2.4.1.7 Decreto 1072 de 2015"],
 b:[
  {t:"steps", items:[
   {h:"Aviso inmediato", x:"El trabajador o un compañero informa de inmediato al jefe inmediato (art. 80). No reportarlo es falta disciplinaria (falta 37)."},
   {h:"Primeros auxilios y remisión", x:"El jefe ordena los primeros auxilios (botiquín, art. 78) y la remisión a la IPS de la red de la ARL o a urgencias (art. 79)."},
   {h:"Reporte a la ARL y a la EPS", x:"La empresa diligencia el FURAT dentro de los 2 días hábiles siguientes (art. 62, Decreto 1295 de 1994)."},
   {h:"Investigación", x:"Equipo investigador con participación del COPASST, dentro de los 15 días siguientes (Resolución 1401 de 2007)."},
   {h:"Medidas correctivas", x:"Plan de acción para evitar la repetición y seguimiento dentro del SG-SST (arts. 80 y 81)."}
  ]},
  {t:"callout", k:"warn", i:"warn", x:"Si el accidente es grave o mortal: además del FURAT, la empresa lo reporta a la Dirección Territorial del Ministerio del Trabajo dentro de los 2 días hábiles (art. 2.2.4.1.7 del Decreto 1072 de 2015)."},
  {t:"callout", k:"ok", i:"shield", x:"El trabajador conserva la atención médica, las incapacidades y demás prestaciones de la ARL aunque el reporte sea extemporáneo; la extemporaneidad genera sanciones para la empresa, no pérdida de derechos."},
  {t:"callout", k:"gold", i:"bolt", x:"Conductores y auxiliares de ruta: el accidente en la vía durante la jornada es accidente de trabajo y debe avisarse de inmediato, incluso si parece leve."},
  {t:"tool", h:"Calcula la fecha límite del FURAT", to:"plazos"}
 ],
 n:"Artículos 78 a 81 del RIT. Insistir en el paso 1: sin aviso inmediato no hay reporte oportuno. Para conductores y auxiliares de ruta: el accidente en la vía durante la jornada es accidente de trabajo y debe avisarse de inmediato, incluso si parece leve. El FURAT lo diligencia Gestión Humana con la información del jefe inmediato."},

{id:"incapacidades", m:"sst", t:"Enfermedad laboral e incapacidades: la ruta y los deberes del trabajador", s:27,
 refs:["Faltas 9, 38 y 69 RIT","Resolución 2674 de 2013"],
 b:[
  {t:"cols", items:[{i:"clock", h:"Incapacidades médicas", x:"Presenta la incapacidad dentro de los 3 días siguientes a su expedición e informa de inmediato la ausencia al jefe inmediato. Solo se admiten las expedidas por el Sistema General de Seguridad Social (falta 9)."}]},
  {t:"steps", h:"Ruta ante una posible enfermedad laboral", items:[
   {h:"Consulta y avisa", x:"Consultar al médico de la EPS e informar al jefe inmediato y a Gestión Humana los síntomas asociados al trabajo."},
   {h:"Calificación del origen", x:"La EPS o la ARL califican en primera oportunidad el origen (común o laboral)."},
   {h:"Juntas de calificación", x:"Si hay desacuerdo, el caso pasa a la Junta Regional y, en apelación, a la Junta Nacional de Calificación de Invalidez."},
   {h:"Atención por la ARL", x:"Calificado el origen laboral, la ARL asume la atención y las prestaciones económicas."},
   {h:"Recomendaciones y reubicación", x:"La empresa aplica las recomendaciones médico-laborales y reubica cuando procede."}
  ]},
  {t:"callout", k:"warn", i:"checkc", x:"Desatender las recomendaciones médico-laborales o negarse a los exámenes ocupacionales es falta sancionable con suspensión hasta por 8 días y, en reincidencia, falta grave (falta 38)."},
  {t:"callout", k:"gold", i:"warn", x:"Quien manipule alimentos padeciendo enfermedad infectocontagiosa, gastrointestinal o dermatológica debe informarlo al jefe inmediato (falta 69; Resolución 2674 de 2013)."},
  {t:"more", h:"¿Quién paga la incapacidad?", x:"La incapacidad de origen común la paga la EPS desde el día 3; la de origen laboral la paga la ARL desde el día siguiente. El trabajador incapacitado o con recomendaciones médicas goza de protección reforzada frente al despido."}
 ],
 n:"Recordar que el trabajador incapacitado o con recomendaciones goza de protección reforzada frente al despido, por lo que la empresa debe gestionar estas situaciones con asesoría jurídica. Mencionar que la incapacidad por origen común la paga la EPS desde el día 3 y la de origen laboral la ARL desde el día siguiente."},

/* Festivos de Colombia (Ley 51 de 1983) */
function easter(y){ var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da); }
var FEST_CACHE = {};
function festivos(y){
  if(FEST_CACHE[y]) return FEST_CACHE[y];
  var s = {}; function add(d){ s[ymd(d)]=1; }
  function mon(m,d){ var x=new Date(y,m-1,d); var w=x.getDay(); if(w!==1){ x.setDate(x.getDate()+((8-w)%7)); } return x; }
  [[1,1],[5,1],[7,20],[8,7],[12,8],[12,25]].forEach(function(p){ add(new Date(y,p[0]-1,p[1])); });
  [[1,6],[3,19],[6,29],[8,15],[10,12],[11,1],[11,11]].forEach(function(p){ add(mon(p[0],p[1])); });
  var e = easter(y); [-3,-2,43,64,71].forEach(function(o){ var x=new Date(e); x.setDate(x.getDate()+o); add(x); });
  FEST_CACHE[y]=s; return s;
}
function isHabil(d){ var w=d.getDay(); return w!==0 && w!==6 && !festivos(d.getFullYear())[ymd(d)]; }
function addHabiles(d, n){ var x=new Date(d); var c=0; while(c<n){ x.setDate(x.getDate()+1); if(isHabil(x)) c++; } return x; }
function addDias(d, n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function days360(a, b){
  var d1=Math.min(a.getDate(),30), d2=b.getDate();
  var lastFeb = b.getMonth()===1 && new Date(b.getFullYear(),2,0).getDate()===d2;
  d2 = lastFeb ? 30 : Math.min(d2,30);
  return (b.getFullYear()-a.getFullYear())*360 + (b.getMonth()-a.getMonth())*30 + (d2-d1) + 1;
}

function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
function lessonText(l){ var t=[l.t].concat(l.refs); l.b.forEach(function(b){ ["x","h"].forEach(function(k){ if(b[k]) t.push(b[k]); }); (b.items||[]).forEach(function(it){ if(typeof it==="string") t.push(it); else { ["h","x","tag","n"].forEach(function(k){ if(it[k]) t.push(it[k]); }); (it.list||[]).forEach(function(z){ t.push(z); }); } }); (b.rows||[]).forEach(function(r){ t.push(r.join(" ")); }); }); return t; }
function doSearch(q){
  var out = $("#res"); if(!out) return;
  var nq = norm(q.trim()); if(nq.length<2){ out.innerHTML=''; return; }
  var words = nq.split(/\s+/);
  var hits = [];
  L.forEach(function(l){ var parts = lessonText(l); var score=0, snip="";
    parts.forEach(function(p){ var np=norm(p); var ok = words.every(function(w){ return np.indexOf(w)>=0; }); if(ok){ score++; if(!snip) snip=p; } });
    if(score) hits.push({l:l, s:score, snip:snip}); });
  hits.sort(function(a,b){ return b.s-a.s; });
  if(!hits.length){ out.innerHTML='<p class="fine">Sin resultados para “'+esc(q)+'”. Prueba con otra palabra o consulta a Gestión Humana.</p>'; return; }
  out.innerHTML = hits.map(function(h){ var m=modById(h.l.m); return '<a class="res" href="#leccion-'+h.l.id+'"><small>'+m.n+' · '+esc(m.t)+'</small><b>'+esc(h.l.t)+'</b><p>'+hl(h.snip, words)+'</p></a>'; }).join("");
}
function hl(text, words){
  var t = esc(text.length>220? text.slice(0,220)+"…" : text);
  var nt = norm(t); var marks=[];
  words.forEach(function(w){ var i=nt.indexOf(w); if(i>=0) marks.push([i,i+w.length]); });
  marks.sort(function(a,b){return b[0]-a[0];});
  marks.forEach(function(m){ t = t.slice(0,m[0])+'<mark>'+t.slice(m[0],m[1])+'</mark>'+t.slice(m[1]); });
  return t;
}

function calcTool(){
  if(TOOL==="recargos"){ var s=parseMoney($("#r_sal").value); store("sal",s); var h=s/HORAS_MES;
    var rows=[["Extra diurna (×1,25)",num("r_hed"),1.25],["Extra nocturna (×1,75)",num("r_hen"),1.75],["Recargo nocturno (+35%)",num("r_rn"),0.35],["Recargo dominical/festivo (+90%)",num("r_dd"),0.90],["Extra diurna dominical (×2,15)",num("r_hedd"),2.15],["Extra nocturna dominical (×2,65)",num("r_hend"),2.65]];
    var tot=0, html=ln("Valor hora ordinaria", money(h));
    rows.forEach(function(r){ if(r[1]>0){ var v=h*r[2]*r[1]; tot+=v; html+=ln(r[0]+" · "+r[1]+" h", money(v)); } });
    html+=ln("Total adicional al salario", money(tot), "tot");
    $("#oRec").innerHTML=html;
    var ext = num("r_hed")+num("r_hen")+num("r_hedd")+num("r_hend");
    $("#wRec").innerHTML = ext>12 ? '<div class="callout warn">'+ic("warn")+'<div>Registraste '+ext+' horas extra. El límite es 2 diarias y 12 semanales (art. 45 del RIT), y siempre con autorización previa.</div></div>' : '';
  }
  if(TOOL==="prestaciones"){ var s2=parseMoney($("#p_sal").value); store("sal",s2); var vr=parseMoney($("#p_var").value);
    var a=parseYmd($("#p_ini").value), b=parseYmd($("#p_fin").value);
    if(!$("#p_ini").value || !$("#p_fin").value || b<a){ $("#oPre").innerHTML='<p class="fine">Revisa las fechas: la fecha final debe ser igual o posterior a la inicial.</p>'; return; }
    var aux = $("#p_aux").checked && s2 <= 2*SMMLV ? AUXT : 0;
    var d=days360(a,b); var base=s2+vr+aux; var ces=base*d/360; var int=ces*d*0.12/360; var vd=d*15/360; var vac=s2/30*vd;
    $("#oPre").innerHTML = ln("Días trabajados (base 360)", d) + ln("Base cesantías", money(base)) + ($("#p_aux").checked && s2>2*SMMLV ? ln("Auxilio de transporte","No aplica (más de 2 SMMLV)") : "") +
      ln("Cesantías", money(ces)) + ln("Intereses a las cesantías (12%)", money(int)) + ln("Días de vacaciones causados", vd.toFixed(2).replace(".",",")+" hábiles") + ln("Valor de esas vacaciones", money(vac)) + ln("Total cesantías + intereses", money(ces+int), "tot");
  }
  if(TOOL==="libranza"){ var s3=parseMoney($("#l_sal").value); store("sal",s3); var otros=parseMoney($("#l_otros").value), cuota=parseMoney($("#l_cuota").value);
    var ley=s3*0.08; var neto=s3-ley-otros; var min=neto*0.5; var recibe=neto-cuota; var max=Math.max(0,neto-min);
    $("#oLib").innerHTML = ln("Salud y pensión (8%)", money(ley)) + ln("Otros descuentos de ley", money(otros)) + ln("Salario neto", money(neto)) + ln("Mínimo que debes recibir (50%)", money(min)) + ln("Cupo máximo para libranzas", money(max)) + ln("Recibirías", money(recibe), "tot");
    $("#sLib").innerHTML = recibe >= min ? '<div class="status ok">Dentro del límite: te quedan '+money(recibe-min)+' de margen.</div>' : '<div class="status bad">Supera el límite en '+money(min-recibe)+'. La empresa no puede aplicar ese descuento.</div>';
  }
  if(TOOL==="plazos"){ var tp=$("#z_tipo").value; var f=parseYmd($("#z_fecha").value||ymd(bogotaNow())); var out=[], note="";
    $("#z_fw").hidden = tp==="cesantias";
    $("#z_fw label").textContent = {accidente:"Fecha del accidente",incapacidad:"Fecha de expedición de la incapacidad",cargos:"Fecha en que te notificaron los cargos",decision:"Fecha en que te notificaron la decisión",luto:"Fecha del fallecimiento",vacaciones:"Fecha de inicio de las vacaciones"}[tp]||"Fecha";
    function D(h,s,d){ out.push('<div class="d"><div><b>'+h+'</b><small>'+s+'</small></div><span class="dt">'+fdate(d)+'</span></div>'); }
    if(tp==="accidente"){ D("Aviso al jefe inmediato","De inmediato, el mismo día (art. 80; falta 37)",f); D("FURAT a la ARL y a la EPS","2 días hábiles (art. 62, Decreto 1295 de 1994)",addHabiles(f,2)); D("Reporte a MinTrabajo si es grave o mortal","2 días hábiles (art. 2.2.4.1.7, Decreto 1072 de 2015)",addHabiles(f,2)); D("Investigación con el COPASST","15 días siguientes (Resolución 1401 de 2007)",addDias(f,15)); note="El FURAT lo diligencia Gestión Humana con la información del jefe inmediato."; }
    if(tp==="incapacidad"){ D("Avisar la ausencia al jefe inmediato","De inmediato",f); D("Entregar la incapacidad","Dentro de los 3 días siguientes a su expedición (falta 9)",addDias(f,3)); note="Solo se admiten incapacidades expedidas por el Sistema General de Seguridad Social. Ante cualquier duda sobre el conteo, entrégala cuanto antes."; }
    if(tp==="cargos"){ D("Último día para presentar descargos","Mínimo 5 días hábiles (art. 108, etapa 2)",addHabiles(f,5)); note="Puedes presentarlos por escrito o en diligencia verbal, controvertir las pruebas y aportar las tuyas. La comunicación de cargos puede darte un plazo mayor."; }
    if(tp==="decision"){ var r=addHabiles(f,5); D("Último día para el recurso de reposición","5 días hábiles (art. 108, etapa 4)",r); D("La empresa resuelve a más tardar","15 días hábiles después de interpuesto el recurso",addHabiles(r,15)); note="El recurso suspende los efectos de la sanción mientras se resuelve. El segundo plazo se cuenta desde el último día; si lo presentas antes, la respuesta llega antes."; }
    if(tp==="luto"){ var ini = isHabil(f)?f:addHabiles(f,1); var fin=addHabiles(ini,4); D("Licencia por luto","5 días hábiles remunerados, del "+fdate(ini).toLowerCase(),fin); D("Último día para acreditarla","30 días siguientes, con certificado de defunción y prueba del parentesco (art. 60)",addDias(f,30)); note="Fecha final estimada contando desde el día hábil del fallecimiento o el siguiente; Gestión Humana confirma las fechas exactas."; }
    if(tp==="vacaciones"){ D("La empresa debe avisarte a más tardar","15 días de anticipación (art. 187 CST)",addDias(f,-15)); var fv=f; var c=isHabil(f)?1:0; if(!c){ fv=addHabiles(f,1); c=1; } fv=addHabiles(fv,14); D("Último día de vacaciones (15 hábiles)","Sábados, domingos y festivos no se descuentan",fv); D("Regreso al trabajo","Primer día hábil siguiente",addHabiles(fv,1)); note="Calculado con sábados no hábiles. Si en tu área el sábado es laborable, Gestión Humana ajusta las fechas."; }
    if(tp==="cesantias"){ var y=bogotaNow().getFullYear()+1; D("Pago de intereses a las cesantías","Directo a ti, 12% anual (Ley 52 de 1975)",new Date(y,0,31)); D("Consignación de cesantías en tu fondo","Art. 99, Ley 50 de 1990",new Date(y,1,14)); note="La mora en la consignación causa un día de salario por cada día de retardo."; }
    $("#oPla").innerHTML = out.join(""); $("#nPla").textContent = note;
  }
}

     (wrong.length?'<div style="text-align:left;width:100%;display:grid;gap:8px;margin-top:6px"><b style="font-size:14px">Repasa:</b>'+wrong.map(function(i){ var l=L.filter(function(x){return x.id===QUIZ[i].l;})[0]; return '<a class="res" href="#leccion-'+l.id+'"><small>Pregunta '+(i+1)+'</small><b>'+esc(l.t)+'</b></a>'; }).join("")+'</div>':'')+
     '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px"><button class="b ghost" type="button" id="qStart">Repetir</button><a class="b pri" href="#constancia">'+ic("pen")+'Ir a la constancia</a></div></div>'; return; }
  var q = QUIZ[QS.i], answered = QS.ans[QS.i];

var sigDirty=false;
function initSig(){
  var c=$("#sig"); if(!c) return; var ctx=c.getContext("2d"); var dpr=window.devicePixelRatio||1;
  function size(){ var r=c.getBoundingClientRect(); c.width=r.width*dpr; c.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#1F2933"; sigDirty=false; }
  size();
  var drawing=false;
  function pt(e){ var r=c.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
  c.addEventListener("pointerdown",function(e){ drawing=true; c.setPointerCapture(e.pointerId); var p=pt(e); ctx.beginPath(); ctx.moveTo(p[0],p[1]); });
  c.addEventListener("pointermove",function(e){ if(!drawing) return; var p=pt(e); ctx.lineTo(p[0],p[1]); ctx.stroke(); sigDirty=true; });
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){ c.addEventListener(ev,function(){ drawing=false; }); });
  $("#sigClr").addEventListener("click",function(){ ctx.clearRect(0,0,c.width,c.height); sigDirty=false; });
  var upd=function(){ var n=$("#c_nom").value.trim()||"__________________", d=$("#c_doc").value.trim()||"__________", k=$("#c_car").value.trim()||"__________";
    $("#cTxt").innerHTML='Yo, <b>'+esc(n)+'</b>, identificado(a) con cédula de ciudadanía No. <b>'+esc(d)+'</b>, en el cargo de <b>'+esc(k)+'</b>, hago constar que recibí, leí y entendí el Reglamento Interno de Trabajo de Distrileco Caucasia S.A.S., actualizado en junio de 2026, y que participé en su socialización realizada el 19 de octubre de 2026 (artículo 113 del RIT).'; };
  ["c_nom","c_doc","c_car"].forEach(function(id){ $("#"+id).addEventListener("input",upd); }); upd();
  $("#fCons").addEventListener("submit",function(e){ e.preventDefault();
    var nom=$("#c_nom").value.trim(), doc=$("#c_doc").value.trim(), car=$("#c_car").value.trim();
    if(!nom||!doc||!car){ $("#cErr").textContent="Completa nombre, cédula y cargo."; return; }
    if(!sigDirty){ $("#cErr").textContent="Falta la firma: dibújala en el recuadro."; return; }
    if(!$("#c_ok").checked){ $("#cErr").textContent="Marca la casilla de declaración para firmar."; return; }
    var tmp=document.createElement("canvas"); tmp.width=360; tmp.height=144; var t=tmp.getContext("2d"); t.fillStyle="#fff"; t.fillRect(0,0,360,144); t.drawImage(c,0,0,360,144);
    var q=store("quiz"); var now=new Date();
    var fecha = new Intl.DateTimeFormat("es-CO",{timeZone:"America/Bogota",day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"}).format(now);
    var plan=store("plan")||[]; plan.push({nom:nom,doc:doc,car:car,fecha:fecha,iso:now.toISOString(),quiz:q?(q.s+"/"+q.t):"",firma:tmp.toDataURL("image/png")});
    store("plan",plan); toast("Constancia firmada por "+nom); route();
  });
}
function planCsv(){ var plan=store("plan")||[]; var rows=[["Nombre","Cédula","Cargo","Fecha y hora (Colombia)","Evaluación"]].concat(plan.map(function(p){ return [p.nom,p.doc,p.car,p.fecha,p.quiz]; })); return rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(";"); }).join("\r\n"); }

/* ====================== MODO PRESENTACIÓN ====================== */
var SLIDES = (function(){ var s=[{k:"cover"},{k:"agenda"}]; MODS.forEach(function(m){ if(m.lead) s.push({k:"div", m:m}); modLessons(m.id).forEach(function(l){ s.push({k:"l", l:l}); }); }); return s; })();
var PI=0, showNotes=false;
function slideHtml(s){
  if(s.k==="cover") return '<div class="slide dark"><div class="cover-logos"><img src="logo-distrileco.png" alt="Distrileco"><img src="logo-velez-rivero.png" alt="Vélez Rivero Abogados"></div><div class="eyebrow">Socialización · 19 de octubre de 2026 · Distrileco Caucasia S.A.S.</div><h2>Reglamento Interno de Trabajo, proceso disciplinario, prestaciones sociales, cesantías y seguridad y salud en el trabajo</h2><p>Socialización de derechos y deberes para los colaboradores de Distrileco Caucasia S.A.S.</p><p style="margin-top:22px;color:#fff"><b>Dr. Juan David Tangarife Vélez</b><br><span style="color:#AAB6C2">Abogado · Asesor jurídico de Distrileco Caucasia S.A.S.</span></p></div>';
  if(s.k==="agenda") return '<div class="slide"><div class="eyebrow">Contenido de la socialización</div><h2>Temas a tratar</h2><div class="blocks"><div class="cards">'+MODS.map(function(m){ return '<div class="card"><div class="ch"><span class="ci">'+ic(m.i)+'</span>'+esc(m.t)+'</div><p>'+esc(m.d)+'</p></div>'; }).join("")+'</div><p style="color:var(--muted);font-size:14px">Las preguntas se atienden al cierre de cada tema y en el espacio final de la sesión.</p></div><div class="sfoot"><span>'+FOOT+'</span><span>02</span></div></div>';
  if(s.k==="div") return '<div class="slide dark"><div class="eyebrow">Tema '+s.m.n+'</div><h2>'+esc(s.m.t)+'</h2><p style="font-family:var(--f-display);font-size:19px;color:#E6EBF0;margin-top:14px">'+esc(s.m.lead)+'</p><p style="margin-top:18px;font-size:13px">'+esc(s.m.refs)+'</p></div>';
  var l=s.l, m=modById(l.m);
  return '<div class="slide"><div class="eyebrow">'+m.n+' · '+esc(m.t)+'</div><h2>'+esc(l.t)+'</h2><div class="blocks">'+l.b.filter(function(b){ return b.t!=="tool"&&b.t!=="cta"&&b.t!=="more"; }).map(rb).join("")+'</div><div class="sfoot"><span>'+FOOT+'</span><span>'+String(l.s).padStart(2,"0")+'</span></div></div>';
}
function slideNotes(s){ if(s.k==="cover") return "Bienvenida. Presentarse como asesor jurídico de la empresa. Explicar que la sesión dura aproximadamente una hora, que el Reglamento fue actualizado en junio de 2026 conforme a la Ley 2466 de 2025 y que, además del Reglamento, se abordarán aspectos esenciales de la relación laboral y de las prestaciones sociales, en particular las cesantías. Al final habrá espacio para preguntas y se firmará la constancia de recibo (arts. 101 y 113 del RIT).";
  if(s.k==="agenda") return "Presentar los temas sin anunciar tiempos. Orientación interna para el expositor: Reglamento, cinco minutos; relaciones laborales y prestaciones, veinte; proceso disciplinario, quince; seguridad y salud, diez; convivencia y preguntas, diez.";
  if(s.k==="div") return s.m.notes; return s.l.n; }
function presShow(){
  var s=SLIDES[PI]; $("#stage").innerHTML=slideHtml(s); $("#stage").scrollTop=0;
  $("#pCount").textContent=(PI+1)+" / "+SLIDES.length;
  $("#pSec").textContent = s.k==="l" ? modById(s.l.m).t : (s.k==="div"? s.m.t : "");
  $("#pBar").style.width=((PI+1)*100/SLIDES.length)+"%";
  var n=$("#notes"); n.hidden=!showNotes; n.innerHTML='<h4>Notas del expositor</h4><p style="margin:0">'+esc(slideNotes(s))+'</p>';
  $("#pNotes").classList.toggle("on",showNotes);
  if(s.k==="l") markRead(s.l.id);
}
function presOpen(i){ PI=Math.max(0,Math.min(SLIDES.length-1,i||0)); $("#pres").hidden=false; document.body.style.overflow="hidden"; presShow(); try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").catch(function(){}); }catch(e){} }
function presClose(){ $("#pres").hidden=true; document.body.style.overflow=""; try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){} route(); }
function presGo(d){ var n=PI+d; if(n<0||n>=SLIDES.length) return; PI=n; presShow(); }

/* ====================== ROUTER ====================== */
function route(){
  var h = (location.hash||"#inicio").slice(1);
  var app=$("#app"), cur=h, html="";
  if(h.indexOf("leccion-")===0){ html=vLeccion(h.slice(8)); cur="temas"; }
  else if(h.indexOf("modulo-")===0 || h==="temas"){ html=vTemas(); cur="temas"; }
  else if(h==="herramientas"){ html=vHerramientas(); }
  else if(h==="evaluacion"){ html=vEvaluacion(); }
  else if(h==="constancia"){ html=vConstancia(); }
  else if(h==="buscar"){ html=vBuscar(); }
  else { html=vInicio(); cur="inicio"; }
  app.innerHTML=html; renderNav(cur);
  if(h.indexOf("modulo-")===0){ var el=document.getElementById(h); if(el) setTimeout(function(){ el.scrollIntoView({block:"start"}); window.scrollBy(0,-80); },0); }
  else window.scrollTo(0,0);
  if(h==="herramientas") calcTool();
  if(h==="evaluacion") quizRender();
  if(h==="constancia") initSig();
  if(h==="buscar"){ var qi=$("#q"); qi.focus(); qi.addEventListener("input",function(){ doSearch(qi.value); }); }
  try{ store("last",h); }catch(e){}
}

/* ====================== EVENTOS ====================== */
document.addEventListener("click", function(e){
  var t=e.target.closest("[data-tool]"); if(t){ TOOL=t.getAttribute("data-tool"); if(location.hash==="#herramientas"){ e.preventDefault(); route(); } }
  t=e.target.closest("[data-tab]"); if(t){ TOOL=t.getAttribute("data-tab"); $$("[data-tab]").forEach(function(b){ b.classList.toggle("on", b===t); }); $("#toolBody").innerHTML=toolBody(TOOL); calcTool(); return; }
  t=e.target.closest("[data-read]"); if(t){ markRead(t.getAttribute("data-read")); toast("Lección marcada como leída"); route(); return; }
  t=e.target.closest("[data-autoread]"); if(t){ markRead(t.getAttribute("data-autoread")); }
  t=e.target.closest("[data-present]"); if(t){ presOpen(+t.getAttribute("data-present")); return; }
  t=e.target.closest("[data-present-lesson]"); if(t){ var id=t.getAttribute("data-present-lesson"); var i=0; SLIDES.forEach(function(s,k){ if(s.k==="l"&&s.l.id===id) i=k; }); presOpen(i); return; }
  t=e.target.closest("[data-copy]"); if(t){ copyText(t.getAttribute("data-copy")); return; }
  t=e.target.closest("[data-opt]"); if(t && QS){ var a=+t.getAttribute("data-opt"); QS.ans[QS.i]=a; if(a===QUIZ[QS.i].a) QS.s++; quizRender(); return; }
  if(e.target.closest("#qStart")){ quizStart(); return; }
  if(e.target.closest("#qNext")){ QS.i++; quizRender(); $("#quiz").scrollIntoView({block:"nearest"}); return; }
  t=e.target.closest("[data-del]"); if(t){ var di=+t.getAttribute("data-del"); var p=(store("plan")||[])[di]; $("#delConfirm").innerHTML='<div class="callout warn" style="margin-top:12px">'+ic("warn")+'<div>¿Eliminar la firma de <b>'+esc(p.nom)+'</b>? <div style="display:flex;gap:8px;margin-top:8px"><button class="b sm danger" type="button" data-delok="'+di+'">Eliminar</button><button class="b sm ghost" type="button" data-delno>Cancelar</button></div></div></div>'; return; }
  t=e.target.closest("[data-delok]"); if(t){ var pl=store("plan")||[]; pl.splice(+t.getAttribute("data-delok"),1); store("plan",pl); toast("Firma eliminada"); route(); return; }
  if(e.target.closest("[data-delno]")){ $("#delConfirm").innerHTML=""; return; }
  if(e.target.closest("#pPrint")){ window.print(); return; }
  if(e.target.closest("#pCsv")){ var blob=new Blob(["﻿"+planCsv()],{type:"text/csv;charset=utf-8"}); var a2=document.createElement("a"); a2.href=URL.createObjectURL(blob); a2.download="constancias-RIT-distrileco-"+ymd(bogotaNow())+".csv"; document.body.appendChild(a2); a2.click(); a2.remove(); return; }
  if(e.target.closest("#pCopy")){ var plan=store("plan")||[]; if(!plan.length){ toast("No hay firmas todavía"); return; } copyText(planCsv().replace(/;/g,"\t").replace(/"/g,"")); return; }
});

  if(e.target.closest("#fRec,#fPre,#fLib,#fPla")) calcTool();
});
document.addEventListener("change", function(e){
  if(e.target.closest("#fRec,#fPre,#fLib,#fPla")) calcTool();
});

  var el=e.target; if(el.matches && el.matches("#r_sal,#p_sal,#p_var,#l_sal,#l_otros,#l_cuota")){ el.value=money(parseMoney(el.value)); }

$("#btnPresent").addEventListener("click", function(){ var h=location.hash.slice(1); var i=0; if(h.indexOf("leccion-")===0){ SLIDES.forEach(function(s,k){ if(s.k==="l"&&s.l.id===h.slice(8)) i=k; }); } presOpen(i); });
$("#pClose").addEventListener("click", presClose);
$("#pPrev").addEventListener("click", function(){ presGo(-1); });
$("#pNext").addEventListener("click", function(){ presGo(1); });
$("#pNotes").addEventListener("click", function(){ showNotes=!showNotes; presShow(); });
$("#pFull").addEventListener("click", function(){ try{ var el=$("#pres"); if(document.fullscreenElement) document.exitFullscreen(); else if(el.requestFullscreen) el.requestFullscreen().catch(function(){ toast("Pantalla completa no disponible aquí"); }); }catch(err){ toast("Pantalla completa no disponible aquí"); } });
document.addEventListener("keydown", function(e){
  if($("#pres").hidden){ if((e.key==="p"||e.key==="P") && !e.target.closest("input,textarea,select")){ $("#btnPresent").click(); } return; }
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ e.preventDefault(); presGo(1); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); presGo(-1); }
  else if(e.key==="Escape"){ if(!document.fullscreenElement) presClose(); }
  else if(e.key==="n"||e.key==="N"){ showNotes=!showNotes; presShow(); }
  else if(e.key==="Home"){ PI=0; presShow(); } else if(e.key==="End"){ PI=SLIDES.length-1; presShow(); }
});
(function(){ var sx=null, sy=null; var st=$("#stage");
  st.addEventListener("touchstart",function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
  st.addEventListener("touchend",function(e){ if(sx===null) return; var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) presGo(dx<0?1:-1); sx=null; },{passive:true});
})();
